[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arfa-aapa"
version = "0.2.0"
description = "ARFA AAPA: Business Q&A assistant for the head manager, demo edition"
requires-python = ">=3.11"
dependencies = []
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "experiments/sql-db-spot/tests", "experiments/company-domains/tests", "experiments/security-hardened/tests"]
